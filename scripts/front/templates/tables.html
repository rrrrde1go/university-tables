{% extends "base.html" %}

{% block title %}Таблицы{% endblock %}

{% block content %}
<h1>Таблицы - день {{ day }}</h1>

<div class="table-placeholder">
    <p> Таблицы для дня {{ day }}</p>

    <a href="{{ url_for('pdf_view', day=day)}}" class="pdf-button">
        Перейти к PDF дня {{ day }}
    </a>

</div>
{% endblock %}
